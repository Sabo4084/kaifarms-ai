services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kaifarms
      POSTGRES_PASSWORD: kaifarms
      POSTGRES_DB: kaifarms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://kaifarms:kaifarms@db:5432/kaifarms
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      - db

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
